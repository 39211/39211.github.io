name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_ref:
        description: 'Test-only override ref; honoured only on non-main refs'
        type: string
        default: main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Keep branch test runs from cancelling production runs.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    # A job split is the cleaner follow-up for branch tests without this environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore SEO overrides (pre-artifact)
        id: restore
        env:
          # Fail closed: any failure stops the job before configure/upload/deploy;
          # GitHub Pages keeps serving the last good deployment.
          OVERRIDE_REMOTE: https://github.com/39211/laundry-social-auto-poster.git
          OVERRIDE_REF: main
          GIT_TERMINAL_PROMPT: "0"
          MIN_OVERRIDE_HTML: "110"
          MIN_SITEMAP_URLS: "110"
          SENTINELS: index.html knowledge/index.html hubs/shoe-care.html guides/knit-shoe-cleaning.html local/fengyuan-laundry-pickup.html local/dali-laundry-pickup.html
          INPUT_OVERRIDE_REF: ${{ inputs.override_ref }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          export SRC="${RUNNER_TEMP}/laundry-seo/seo-overrides"
          REF="$OVERRIDE_REF"
          if [ "$RUN_REF" = refs/heads/main ]; then
            if [ -n "$INPUT_OVERRIDE_REF" ] && [ "$INPUT_OVERRIDE_REF" != main ]; then
              echo "::error::Production must overlay laundry@main"
              exit 1
            fi
          elif [ -n "$INPUT_OVERRIDE_REF" ]; then
            REF="$INPUT_OVERRIDE_REF"
          fi

          fetch_overrides() {
            local attempt
            for attempt in 1 2 3; do
              rm -rf "${RUNNER_TEMP}/laundry-seo" || return 1
              echo "::notice::Fetching seo-overrides (attempt $attempt, ref $REF)"
              if timeout --kill-after=10 120 git clone --depth 1 --filter=blob:none --sparse --branch "$REF" \
                  "$OVERRIDE_REMOTE" "${RUNNER_TEMP}/laundry-seo" &&
                  timeout --kill-after=10 120 git -C "${RUNNER_TEMP}/laundry-seo" sparse-checkout set seo-overrides; then
                return 0
              fi
              case "$attempt" in
                1) sleep 10 ;;
                2) sleep 30 ;;
              esac
            done
            return 1
          }
          if ! fetch_overrides; then
            echo "::error::Failed to fetch seo-overrides after 3 attempts"
            exit 1
          fi
          SHA=$(git -C "${RUNNER_TEMP}/laundry-seo" rev-parse HEAD)
          echo "::notice::seo-overrides from laundry@$SHA (ref $REF)"

          # Pre-overlay sanity checks.
          if [ ! -d "$SRC" ]; then
            echo "::error::seo-overrides/ missing after fetch"
            exit 1
          fi
          HTML_COUNT=$(find "$SRC" -type f -name '*.html' | wc -l)
          if [ "$HTML_COUNT" -lt "$MIN_OVERRIDE_HTML" ]; then
            echo "::error::Only $HTML_COUNT override HTML files; require $MIN_OVERRIDE_HTML"
            exit 1
          fi
          for sentinel in $SENTINELS; do
            if [ ! -f "$SRC/$sentinel" ]; then
              echo "::error::Missing override sentinel: $sentinel"
              exit 1
            fi
          done
          python3 << 'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          try:
              root = ET.parse(Path(os.environ["SRC"]) / "sitemap.xml").getroot()
              locs = [el.text or "" for el in root.iter() if el.tag.split("}")[-1] == "loc"]
              if len(locs) < int(os.environ["MIN_SITEMAP_URLS"]):
                  raise ValueError(f"Only {len(locs)} override sitemap URLs")
              if any(urlsplit(loc.strip()).path.startswith("/posts/") for loc in locs):
                  raise ValueError("Override sitemap contains /posts/ URLs")
          except (OSError, ET.ParseError, ValueError) as exc:
              raise SystemExit(f"::error::Pre-overlay sitemap check failed: {exc}")
          print(f"Pre-overlay: {len(locs)} sitemap URLs")
          PY
          echo "::notice::Pre-overlay: $HTML_COUNT HTML files; all sentinels present"

          echo "::notice::Overlaying seo-overrides onto repo root (excluding README.md)"
          # rsync keeps directory structure; exclude README only at any depth.
          rsync -a --exclude 'README.md' "$SRC"/ ./

          # Post-overlay verification before any post-processing.
          if ! find "$SRC" -type f ! -name README.md -print0 > "${RUNNER_TEMP}/overlay-manifest"; then
            echo "::error::Failed to enumerate overlay files"
            exit 1
          fi
          EXPECTED_FILE_COUNT=$(tr -cd '\0' < "${RUNNER_TEMP}/overlay-manifest" | wc -c)
          FILE_COUNT=0
          while IFS= read -r -d '' file; do
            relative="${file#"$SRC"/}"
            if ! cmp -s "$file" "./$relative"; then
              echo "::error::Overlay mismatch: $relative"
              exit 1
            fi
            FILE_COUNT=$((FILE_COUNT + 1))
          done < "${RUNNER_TEMP}/overlay-manifest"
          if [ "$FILE_COUNT" -ne "$EXPECTED_FILE_COUNT" ] || [ "$FILE_COUNT" -le 0 ]; then
            echo "::error::Verified $FILE_COUNT overlay files; expected $EXPECTED_FILE_COUNT and a non-empty overlay"
            exit 1
          fi
          echo "::notice::Post-overlay: $FILE_COUNT files byte-identical"
          python3 << 'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          try:
              root = ET.parse("sitemap.xml").getroot()
              locs = [el.text or "" for el in root.iter() if el.tag.split("}")[-1] == "loc"]
              for loc in locs:
                  url = loc.strip()
                  prefix = "https://sixiangjialaundry.com/"
                  if not url.startswith(prefix):
                      raise ValueError(f"Unexpected sitemap URL: {url}")
                  relative = url[len(prefix):]
                  if not relative or relative.endswith("/"):
                      relative += "index.html"
                  if not Path(relative).is_file():
                      raise ValueError(f"Missing sitemap target: {relative}")
          except (OSError, ET.ParseError, ValueError) as exc:
              raise SystemExit(f"::error::Post-overlay sitemap check failed: {exc}")
          print(f"Post-overlay: {len(locs)} sitemap targets exist")
          PY

          echo "::notice::Forcing noindex,follow on posts/*slot*.html"
          python3 << 'PY'
          import glob
          import re
          from pathlib import Path

          # Live format on posts/2026-09-24-slot-01.html:
          #   <meta name="robots" content="index, follow, max-image-preview:large" />
          #   <meta name="googlebot" content="index, follow, max-image-preview:large" />
          META_RE = re.compile(
              r'(<meta\s+name="(robots|googlebot)"\s+content=")([^"]*)("\s*/?>)',
              re.IGNORECASE,
          )
          HEAD_OPEN_RE = re.compile(r"(<head[^>]*>)", re.IGNORECASE)

          def patch(html: str) -> str:
              found = {"robots": False, "googlebot": False}

              def repl(m: re.Match) -> str:
                  name = m.group(2).lower()
                  found[name] = True
                  return f'{m.group(1)}noindex, follow{m.group(4)}'

              out = META_RE.sub(repl, html)
              if not found["robots"]:
                  insert = '    <meta name="robots" content="noindex, follow" />\n'
                  if HEAD_OPEN_RE.search(out):
                      out = HEAD_OPEN_RE.sub(r"\1\n" + insert, out, count=1)
                  else:
                      out = insert + out
              return out

          paths = sorted(glob.glob("posts/*slot*.html"))
          changed = 0
          for path in paths:
              p = Path(path)
              original = p.read_text(encoding="utf-8")
              updated = patch(original)
              if updated != original:
                  p.write_text(updated, encoding="utf-8")
                  changed += 1
          print(f"Patched robots meta on {changed}/{len(paths)} slot pages")
          PY

          echo "::notice::Removing posts/*slot* URLs from sitemaps / RSS / JSON feed"
          python3 << 'PY'
          import json
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SLOT_IN_POSTS = re.compile(r"/posts/[^\"'<\s]*slot[^\"'<\s]*", re.IGNORECASE)

          def is_slot_url(url: str) -> bool:
              return bool(SLOT_IN_POSTS.search(url or ""))

          def strip_xml_urlset(path: Path) -> bool:
              """Remove <url> entries whose <loc> is a slot post. Keep XML valid."""
              raw = path.read_text(encoding="utf-8")
              # Preserve XML declaration if present
              decl = ""
              m = re.match(r"^\s*(<\?xml[^[?]*\?>)\s*", raw)
              if m:
                  decl = m.group(1) + "\n"
                  body = raw[m.end() :]
              else:
                  body = raw
              try:
                  root = ET.fromstring(body)
              except ET.ParseError as exc:
                  print(f"ERROR: {path} failed to parse before edit: {exc}", file=sys.stderr)
                  raise
              # Handle default xmlns
              ns = ""
              if root.tag.startswith("{"):
                  ns = root.tag.split("}")[0] + "}"
              removed = 0
              for url_el in list(root):
                  if not url_el.tag.endswith("url"):
                      continue
                  loc = None
                  for child in url_el:
                      if child.tag.endswith("loc"):
                          loc = (child.text or "").strip()
                          break
                  if loc and is_slot_url(loc):
                      root.remove(url_el)
                      removed += 1
              # Serialize with original namespace
              if ns:
                  # Re-register so ElementTree emits xmlns on root
                  ET.register_namespace("", ns[1:-1])
              xml_body = ET.tostring(root, encoding="unicode")
              # Ensure trailing newline
              if not xml_body.endswith("\n"):
                  xml_body += "\n"
              new_raw = decl + xml_body
              # Validate round-trip
              try:
                  ET.fromstring(re.sub(r"^\s*<\?xml[^[?]*\?>\s*", "", new_raw))
              except ET.ParseError as exc:
                  print(f"ERROR: {path} invalid after edit: {exc}", file=sys.stderr)
                  raise
              if new_raw != raw:
                  path.write_text(new_raw, encoding="utf-8")
              print(f"{path}: removed {removed} slot <url> entries")
              return removed > 0

          def strip_rss(path: Path) -> bool:
              raw = path.read_text(encoding="utf-8")
              decl = ""
              m = re.match(r"^\s*(<\?xml[^[?]*\?>)\s*", raw)
              if m:
                  decl = m.group(1) + "\n"
                  body = raw[m.end() :]
              else:
                  body = raw
              try:
                  root = ET.fromstring(body)
              except ET.ParseError as exc:
                  print(f"ERROR: {path} failed to parse before edit: {exc}", file=sys.stderr)
                  raise
              # RSS: <rss><channel><item>...</item>
              channels = [el for el in root.iter() if el.tag.endswith("channel")]
              removed = 0
              for channel in channels:
                  for item in list(channel):
                      if not item.tag.endswith("item"):
                          continue
                      texts = []
                      for child in item:
                          if child.tag.endswith(("link", "guid")) and child.text:
                              texts.append(child.text.strip())
                      if any(is_slot_url(t) for t in texts):
                          channel.remove(item)
                          removed += 1
              xml_body = ET.tostring(root, encoding="unicode")
              if not xml_body.endswith("\n"):
                  xml_body += "\n"
              new_raw = decl + xml_body
              try:
                  ET.fromstring(re.sub(r"^\s*<\?xml[^[?]*\?>\s*", "", new_raw))
              except ET.ParseError as exc:
                  print(f"ERROR: {path} invalid after edit: {exc}", file=sys.stderr)
                  raise
              if new_raw != raw:
                  path.write_text(new_raw, encoding="utf-8")
              print(f"{path}: removed {removed} slot <item> entries")
              return removed > 0

          def strip_feed_json(path: Path) -> bool:
              data = json.loads(path.read_text(encoding="utf-8"))
              items = data.get("items")
              if not isinstance(items, list):
                  print(f"{path}: no items list; skipped")
                  return False
              before = len(items)
              kept = [
                  item
                  for item in items
                  if not (
                      isinstance(item, dict)
                      and is_slot_url(str(item.get("url") or item.get("id") or ""))
                  )
              ]
              data["items"] = kept
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"{path}: removed {before - len(kept)}/{before} slot items")
              return len(kept) != before

          touched = False
          for name in ("sitemap.xml", "ai-sitemap.xml"):
              p = Path(name)
              if p.is_file():
                  touched = strip_xml_urlset(p) or touched
              else:
                  print(f"{name}: not present")
          if Path("rss.xml").is_file():
              touched = strip_rss(Path("rss.xml")) or touched
          else:
              print("rss.xml: not present")
          if Path("feed.json").is_file():
              touched = strip_feed_json(Path("feed.json")) or touched
          else:
              print("feed.json: not present")
          # Final explicit validate of sitemap.xml (required)
          if Path("sitemap.xml").is_file():
              ET.parse("sitemap.xml")
              text = Path("sitemap.xml").read_text(encoding="utf-8")
              if "\\" in text:
                  raise SystemExit("sitemap.xml still contains backslashes")
              if SLOT_IN_POSTS.search(text):
                  raise SystemExit("sitemap.xml still contains slot post URLs")
              print("sitemap.xml: validated (0 slot URLs, parses, no backslashes)")
          print(f"feed cleanup touched={touched}")
          PY

          # STOPGAP (2026-10-06): remove once the mirror-source fix (merge of laundry main into fix/reel-v3-two-reference-images, then the Windows checkout fast-forwarded) is live and the mirror itself emits a noindex posts hub and an ai-sitemap without /posts/.
          python3 << 'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          p = Path("posts/index.html")
          if p.is_file():
              raw = p.read_text(encoding="utf-8")
              found_robots = False

              def patch_meta(m):
                  global found_robots
                  tag = m.group(0)
                  name = re.search(r"\bname\s*=\s*(['\"])(robots|googlebot)\1", tag, re.I)
                  if not name:
                      return tag
                  if name.group(2).lower() == "robots":
                      found_robots = True
                  content = re.compile(r"(\bcontent\s*=\s*)(['\"])(.*?)\2", re.I | re.S)
                  if content.search(tag):
                      return content.sub(lambda c: c.group(1) + c.group(2) + "noindex, follow" + c.group(2), tag)
                  return re.sub(r"(\s*/?>)$", r' content="noindex, follow"\1', tag)

              updated = re.sub(r"<meta\b[^>]*>", patch_meta, raw, flags=re.I)
              if not found_robots:
                  updated, inserted = re.subn(r"(<head\b[^>]*>)", r'\1\n    <meta name="robots" content="noindex, follow" />', updated, count=1, flags=re.I)
                  if not inserted:
                      raise SystemExit("::error::posts/index.html has no head for robots meta")
              if updated != raw:
                  p.write_text(updated, encoding="utf-8")
              print("posts/index.html: robots/googlebot set to noindex, follow")
          else:
              print("posts/index.html: not present")

          p = Path("ai-sitemap.xml")
          if p.is_file():
              raw = p.read_text(encoding="utf-8")
              declaration = re.match(r"^\s*(<\?xml[^?]*\?>)\s*", raw)
              decl = declaration.group(1) + "\n" if declaration else ""
              root = ET.fromstring(raw[declaration.end():] if declaration else raw)
              removed = 0
              for element in list(root):
                  if element.tag.split("}")[-1] != "url":
                      continue
                  loc = next((child.text or "" for child in element if child.tag.split("}")[-1] == "loc"), "")
                  if urlsplit(loc.strip()).path.startswith("/posts/"):
                      root.remove(element)
                      removed += 1
              if root.tag.startswith("{"):
                  ET.register_namespace("", root.tag.split("}")[0][1:])
              body = ET.tostring(root, encoding="unicode") + "\n"
              ET.fromstring(body)
              p.write_text(decl + body, encoding="utf-8")
              print(f"ai-sitemap.xml: removed {removed} /posts/ <url> entries")
          else:
              print("ai-sitemap.xml: not present")
          PY
          # END STOPGAP (2026-10-06).

          # Final assertions before signalling restore readiness.
          python3 << 'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          def locs(path):
              return [el.text or "" for el in ET.parse(path).getroot().iter() if el.tag.split("}")[-1] == "loc"]

          try:
              source = locs(Path(os.environ["SRC"]) / "sitemap.xml")
              live = locs("sitemap.xml")
              if len(live) != len(source):
                  raise ValueError(f"Sitemap count changed: {len(source)} -> {len(live)}")
              for name in ("sitemap.xml", "ai-sitemap.xml"):
                  if name == "sitemap.xml" or Path(name).is_file():
                      if any(urlsplit(url.strip()).path.startswith("/posts/") for url in locs(name)):
                          raise ValueError(f"{name} contains /posts/ URLs")
              hub = Path("posts/index.html")
              if hub.is_file():
                  robots = []
                  for tag in re.findall(r"<meta\b[^>]*>", hub.read_text(encoding="utf-8"), re.I):
                      if re.search(r"\bname\s*=\s*(['\"])robots\1", tag, re.I):
                          content = re.search(r"\bcontent\s*=\s*(['\"])(.*?)\1", tag, re.I | re.S)
                          robots.append(content.group(2) if content else "")
                  if not robots or any("noindex" not in [token.strip().lower() for token in value.split(",")] for value in robots):
                      raise ValueError("posts/index.html robots meta is not noindex")
          except (OSError, ET.ParseError, ValueError) as exc:
              raise SystemExit(f"::error::Final SEO assertions failed: {exc}")
          print(f"Final SEO assertions: {len(live)}/{len(source)} sitemap URLs, 0 /posts/ URLs, posts hub noindex if present")
          PY

          echo "restore_ready=true" >> "$GITHUB_OUTPUT"

      # Upload the verified tree before any commit/rebase can change it.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: .

      - name: Commit SEO restore if tree changed
        if: >
          github.ref == 'refs/heads/main' &&
          steps.restore.outcome == 'success' &&
          (
            github.event_name == 'workflow_dispatch' ||
            !(startsWith(github.event.head_commit.message || '', 'Restore SEO overrides'))
          )
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No SEO restore changes to commit"
            exit 0
          fi
          MSG="Restore SEO overrides $(TZ=Asia/Taipei date +%Y-%m-%d)"
          git commit -m "$MSG"
          echo "::notice::Pushing: $MSG"
          if git push origin HEAD:main; then
            echo "::notice::SEO restore commit pushed"
          else
            echo "::warning::Push failed; retrying after pull --rebase"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::SEO restore push failed; continuing deploy with restored workspace"
            elif git push origin HEAD:main; then
              echo "::notice::SEO restore commit pushed after rebase"
            else
              echo "::warning::SEO restore push failed; continuing deploy with restored workspace"
            fi
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
