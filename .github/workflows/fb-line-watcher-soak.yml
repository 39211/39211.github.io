name: fb-line-watcher soak

# 發布前的最小再驗 gate：Linux 與 Windows 各跑滿一次長時間壓測。
# 不掛在 pull_request 上（單次要跑 30 分鐘），改成手動觸發。
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 每個平台的壓測分鐘數
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: fb-line-watcher-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: soak ${{ inputs.minutes || '30' }}m (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: tools/fb-line-watcher
    env:
      CI: "1"
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22.13
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: tools/fb-line-watcher/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium runtime on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Run soak
        run: npm run soak -- --minutes ${{ inputs.minutes || '30' }} --json soak-report.json

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-report-${{ matrix.os }}
          path: tools/fb-line-watcher/soak-report.json
          if-no-files-found: warn
