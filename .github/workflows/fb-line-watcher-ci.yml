name: fb-line-watcher CI

on:
  pull_request:
    paths:
      - "tools/fb-line-watcher/**"
      - ".github/workflows/fb-line-watcher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-line-watcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: tools/fb-line-watcher
    env:
      CI: "1"
      TZ: Asia/Taipei

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22.13
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: tools/fb-line-watcher/package-lock.json

      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium runtime and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium runtime on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            try {
              [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
              Write-Host "Parsed $($_.Name)"
            }
            catch {
              Write-Error "$($_.Name): $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Typecheck
        run: npm run typecheck

      - name: Run all tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test compiled CLI
        run: node dist/src/cli.js
